name: App Android - Escala de Trabalho

on:
  push:
    paths:
      - "android-escala/**"
      - ".github/workflows/android-escala.yml"
  pull_request:
    paths:
      - "android-escala/**"
      - ".github/workflows/android-escala.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-escala
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-trabalho-apk
          path: android-escala/app/build/outputs/apk/release/*.apk
